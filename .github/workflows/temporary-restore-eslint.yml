name: Temporary restore ESLint fixes onto main-based branch

on:
  push:
    branches: [chore/restore-eslint-main]
    paths:
      - .github/workflows/temporary-restore-eslint.yml

permissions:
  contents: write

jobs:
  restore:
    name: Restore lint fixes without merging
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SANITY_API_VERSION: "2024-01-01"
      NEXT_PUBLIC_SANITY_DATASET: "production"
      NEXT_PUBLIC_SANITY_PROJECT_ID: "3x2g2pvc"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: chore/restore-eslint-main
          fetch-depth: 0

      - name: Cherry-pick reviewed lint-only commits
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/chore/restore-eslint-main"
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin chore/eslint-cleanup
          git cherry-pick 94b7eb1f6fb0b09aea9d056047e290637bc900f9
          git cherry-pick -X theirs bd53c3b892910f0f4484d1b9204c739cbe16f932
          git cherry-pick 97ec96eb95d6816767499fd241a02c952f74337e
          git cherry-pick 8c634b4bb58f20d5163082665fe8142ac1fdde45

      - name: Preserve canonical metadata on routes touched by previous SEO PR
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          import re
          import subprocess
          routes = [
              "app/(site)/ingredients/page.tsx",
              "app/(site)/page.tsx",
              "app/(site)/products/page.tsx",
              "app/(site)/skin-concerns/page.tsx",
          ]
          for path in routes:
              before = subprocess.check_output(["git", "show", f"origin/main:{path}"], text=True)
              metadata = re.search(r'export const metadata: Metadata = \{\n.*?\n\};\n', before, re.S)
              if metadata is None:
                  raise RuntimeError(f"Missing original metadata for {path}")
              candidate = Path(path).read_text()
              if 'export const metadata: Metadata' not in candidate:
                  if 'type Sanity' not in candidate:
                      raise RuntimeError(f"Missing type anchor for {path}")
                  candidate = candidate.replace('type Sanity', metadata.group(0) + '\ntype Sanity', 1)
              if 'import type { Metadata } from "next";' not in candidate:
                  candidate = 'import type { Metadata } from "next";\n' + candidate
              Path(path).write_text(candidate)
              if metadata.group(0) not in candidate:
                  raise RuntimeError(f"SEO metadata changed for {path}")
              print(f"Verified original metadata for {path}")
          PY
          git add -- 'app/(site)/ingredients/page.tsx' 'app/(site)/page.tsx' 'app/(site)/products/page.tsx' 'app/(site)/skin-concerns/page.tsx'
          if ! git diff --cached --quiet; then
            git commit -m "chore: retain reviewed SEO canonical metadata during lint restoration"
          fi

      - name: Verify no dependency files changed
        run: |
          git diff --exit-code origin/main HEAD -- package.json package-lock.json

      - name: Push lint restoration only to dedicated branch
        shell: bash
        run: |
          set -euo pipefail
          git push origin HEAD:refs/heads/chore/restore-eslint-main

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Validate clean install
        run: npm ci --no-audit --no-fund

      - name: Validate ESLint
        run: npm run lint

      - name: Validate production build (can expose original Google Fonts flake)
        run: npm run build
