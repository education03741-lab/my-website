name: Temporary Next.js font loader validation

on:
  push:
    branches: [fix/nextjs-font-loader-1643]
    paths:
      - package.json
      - .github/workflows/temporary-next-font-fix.yml

permissions:
  contents: write

jobs:
  font-fix:
    name: Update lockfile and test production build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      NEXT_TELEMETRY_DISABLED: "1"
      NEXT_PUBLIC_SANITY_API_VERSION: "2024-01-01"
      NEXT_PUBLIC_SANITY_DATASET: "production"
      NEXT_PUBLIC_SANITY_PROJECT_ID: "3x2g2pvc"
    steps:
      - name: Check out feature branch
        uses: actions/checkout@v4
        with:
          ref: fix/nextjs-font-loader-1643

      - name: Set up Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Update lockfile from package.json without install scripts
        run: npm install --package-lock-only --ignore-scripts --no-audit --no-fund

      - name: Verify manifest was not modified
        run: git diff --exit-code -- package.json

      - name: Commit only updated lockfile on feature branch
        shell: bash
        run: |
          set -euo pipefail
          test "$GITHUB_REF" = "refs/heads/fix/nextjs-font-loader-1643"
          git add -- package-lock.json
          if ! git diff --cached --quiet; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git commit -m "build: update lockfile for Next.js 16.4.3"
            git push origin HEAD:refs/heads/fix/nextjs-font-loader-1643
          fi

      - name: Validate reproducible installation
        run: npm ci --no-audit --no-fund

      - name: Show actual installed Next.js version
        run: npm ls next eslint-config-next --depth=0

      - name: Validate Next.js production build and sitemap
        run: npm run build
